# GIO910 - Nginx Configuration for Supabase
# Versi: 1.0.0
# Tanggal: 2026-11-26

# Supabase API Gateway
upstream supabase_kong {
    server supabase-kong:8000;
}

# Supabase Studio
upstream supabase_studio {
    server supabase-studio:3000;
}

# Edge Functions
upstream edge_function {
    server edge-function:8500;
}

# Main server configuration
server {
    listen 80;
    server_name localhost;
    
    # Redirect to HTTPS (uncomment for production)
    # return 301 https://$host$request_uri;
    
    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Client-Info $http_x_client_info;
    
    # Supabase API routes
    location /auth/v1 {
        proxy_pass http://supabase_kong/auth/v1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    location /storage/v1 {
        proxy_pass http://supabase_kong/storage/v1;
        proxy_http_version 1.1;
    }
    
    location /realtime/v1 {
        proxy_pass http://supabase_kong/realtime/v1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    location /rest/v1 {
        proxy_pass http://supabase_kong/rest/v1;
        proxy_http_version 1.1;
    }
    
    location /graphql/v1 {
        proxy_pass http://supabase_kong/graphql/v1;
        proxy_http_version 1.1;
    }
    
    # Edge Functions
    location /functions/v1 {
        proxy_pass http://edge_function/functions/v1;
        proxy_http_version 1.1;
    }
    
    # Supabase Studio
    location / {
        proxy_pass http://supabase_studio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Static files
    location /assets {
        alias /app/assets;
        expires 30d;
        access_log off;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

